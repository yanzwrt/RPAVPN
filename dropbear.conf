# =========================================
# Dropbear Config for RPAVPN
# Aman dipakai berdampingan dengan OpenSSH
# =========================================

# 0 = Dropbear aktif, 1 = Dropbear tidak jalan
NO_START=0

# Port utama Dropbear (tambahan selain OpenSSH)
# Contoh umum yang jarang diblok operator: 143
DROPBEAR_PORT=143

# Tambahan port lain untuk Dropbear (multiport)
# Di sini kita tambahkan port 110 (juga jarang diblok)
# Kalau mau tambah port lagi (misal 109), formatnya:
# DROPBEAR_EXTRA_ARGS="-p 110 -p 109"
DROPBEAR_EXTRA_ARGS="-p 110"

# File banner yang dikirim sebelum login
# Bisa kamu ubah isi /etc/issue.net untuk pesan custom
DROPBEAR_BANNER="/etc/issue.net"

# Hostkey dibiarkan default:
#   /etc/dropbear/dropbear_rsa_host_key
#   /etc/dropbear/dropbear_dss_host_key
#   /etc/dropbear/dropbear_ecdsa_host_key
# Kalau mau custom, tinggal un-comment dan isi.
#DROPBEAR_RSAKEY="/etc/dropbear/dropbear_rsa_host_key"
#DROPBEAR_DSSKEY="/etc/dropbear/dropbear_dss_host_key"
#DROPBEAR_ECDSAKEY="/etc/dropbear/dropbear_ecdsa_host_key"

# Window size besar untuk performa lebih baik (default kecil)
DROPBEAR_RECEIVE_WINDOW=65536
